# PyPSA-Eur v2026.09.0 overlay: 15-node ES/FR/PT electricity-only model for the
# Spain 80% hourly matching study. Scope: today's system (2025 fleet), no
# capacity-expansion year. Temporal resolution: hourly (averaging: 3h for quick runs).

version: v2026.09.0
tutorial: false

run:
  name: wy2024
  scenarios:
    enable: true
    file: ../config/scenarios.yaml
  disable_progressbar: true
  shared_resources:
    policy: false

foresight: overnight

planning_horizons:
- 2025

countries:
- ES
- FR
- PT

snapshots:
  start: "2024-01-01"
  end: "2025-01-01"
  inclusive: left

enable:
  drop_leap_day: true

co2_budget:
  emissions_scope: CO2
  relative: false
  upper:
  lower:

electricity:
  base_network: osm
  transmission_limit: v1.0
  renewable_carriers:
  - solar
  - solar-hsat
  - onwind
  - offwind-ac
  - offwind-dc
  - offwind-float
  - hydro
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
  estimate_renewable_capacities:
    enable: true
    from_powerplantmatching: true
    from_irenastat: false
    year: 2024

atlite:
  default_cutout: europe-2024-sarah3-era5
  nprocesses: 4
  show_progress: false

renewable:
  # 5 CF classes per region for every PPA-candidate technology; existing plants are
  # spatially joined to their class, so fleet profiles reflect where plants actually
  # stand, and DC PPA candidates contract the best class with remaining potential.
  onwind:
    resource_classes: 5
  solar:
    resource_classes: 5
  solar-hsat:
    resource_classes: 5

clustering:
  mode: busmap
  cluster_network:
    n_clusters: 15
    algorithm: kmeans
  # ES receives the remainder (1 - 0.2667 - 0.1333 = 0.60 = 9/15 clusters) so that
  # distribute_n_clusters_to_countries preserves load-weighting between mainland (ES0: 8)
  # and Balearics (ES1: 1) instead of dividing ES weight equally across sub_networks.
  focus_weights:
    FR: 0.2667
    PT: 0.1333
  temporal:
    averaging: false
    segmentation: false
    representative: false

sector:
  enabled: false

costs:
  year:

data:
  costs:
    source: archive
    version: v0.15.0
  cutout:
    source: archive
    version: v1.0

# Upstream PyPSA-Eur settings (its build records the solver, e.g. in time aggregation);
# the study solves read spain_cfe.solving instead.
solving:
  options:
    load_shedding:
      enable: true
      default_cost: 10000
      all_carriers: true
  solver:
    name: highs
    options: highs-simplex

spain_cfe:
  # Scenario suites; `suite` selects the one to run (see doc/decision_log.md).
  # Policies: unmatched_dc = no policy; strict_hourly_80_ppa_only = the decree's
  # Art. 9 (80% every hour); hourly_80_ppa_only = 80% on average (24/7 CFE score);
  # hourly_80_grid_credit = the same with grid credit; annual_80_res = the decree's
  # Art. 8 alone. Other targets are pre-built through the policy name (e.g.
  # annual_100_res, voluntary practice), as is the _cfe suffix (nuclear as clean).
  # `policies` maps each PPA siting to its policies: spain_wide = anywhere in
  # mainland Spain (the site's synchronous area), local_region = the site's region.
  # A no_dc baseline row is added for every run.
  # excess_cap: the cap sigma on annual sales back to the grid,
  # sum_t ex_t <= sigma * sum_t d_t, one scenario per value. The study uses 0.0
  # (surplus is stored or curtailed); add 0.20 for a sales-allowed scenario (ex20).
  # The no_dc and unmatched_dc baselines have no surplus and are solved once, under ex0.
  # output_dir: where a suite writes its summary table and figures (default results/);
  # solved scenarios are shared across suites under results/{run}/.
  suite: core
  suites:
    # Working subset: the 2024 reference weather year, one DC size, all policies.
    core:
      runs: [wy2024]
      policies:
        spain_wide: [unmatched_dc, annual_80_res, hourly_80_ppa_only, strict_hourly_80_ppa_only, hourly_80_grid_credit]
        local_region: [hourly_80_ppa_only]
      dc_mw: [500]
      excess_cap: [0.0]
    # Full matrix: all policies x all DC sizes on the 2024 reference weather year. Other
    # weather years are stage iv: they need their upstream builds and a remap of the
    # 2024 France border flows (decision log C5).
    full:
      runs: [wy2024]
      policies:
        spain_wide:
        - unmatched_dc
        - annual_80_res
        - hourly_80_ppa_only
        - strict_hourly_80_ppa_only
        - hourly_80_grid_credit
        - annual_90_res
        - hourly_90_ppa_only
        - strict_hourly_90_ppa_only
        - hourly_90_grid_credit
        local_region: [hourly_80_ppa_only, hourly_90_ppa_only]
      dc_mw: [500, 2000, 4000, 6000]
      excess_cap: [0.0]
    # The revised draft of 26 October 2026. Its five-year transition (DT1) for data
    # centers in the automatic load-reduction scheme floors the matched share only in
    # tariff periods P1 and P2: 60% in P1 hours to end-2028 (transition_p1_60), then 70% in
    # P1 and 60% in P2 (transition_p1_70_p2_60).
    # Run: snakemake --configfile config/suite.draft_2026_10.yaml
    draft_2026_10:
      runs: [wy2024]
      policies:
        spain_wide:
        - unmatched_dc
        - strict_hourly_80_ppa_only
        - hourly_80_ppa_only
        - hourly_90_ppa_only
        - transition_p1_60
        - transition_p1_70_p2_60
      dc_mw: [500]
      excess_cap: [0.0]
      output_dir: results/draft_2026_10
  # prepare_network.py patch engine: cited corrections, each individually switchable.
  patches:
    boundary_flows: true        # FR border closure from measured 2024 flows (model closure, always on)
    national_capacities: false  # fleet totals per carrier from published actuals (pro rata nodal)
    wind_correction: false      # ES/PT wind profiles scaled to cited actuals (residual ERA5 bias)
    phs_split: false            # pure-PHS energy/pumping/efficiency; mixed stays in reservoir hydro
    chp_profile: false          # cogeneration as fixed profile (Redeia monthly shape and output)
    csp: false                  # CSP capacity with solar-shaped profile scaled to Redeia output
    biomass_availability: false # cap biomass/waste at the realized capacity factor (fuel-limited)
    prices: false               # marginal costs from cited fuel + EU ETS prices (raw has no CO2 price)
    ntc_caps: false             # ES-FR / ES-PT / Balearic corridors capped to published NTC
    demand: false               # country loads scaled to cited annual busbar demand
    hydro_inflow: false         # wy2024 runs only: inflow to observed 2024 hydro energy
    fr_nuclear_profile: false   # FR nuclear seasonalized by the measured 2024 monthly output (calendar assumed to persist)
    ma_ad_exports: false        # fixed ES exports to Morocco and Andorra
  # named variants override the patch defaults; the {variant} wildcard picks one
  variants:
    raw: {}
    patched:
      national_capacities: true
      wind_correction: true
      phs_split: true
      chp_profile: true
      csp: true
      biomass_availability: true
      prices: true
      ntc_caps: true
      demand: true
      hydro_inflow: true
      fr_nuclear_profile: true
      ma_ad_exports: true
  dc:
    # Each listed site hosts the FULL dc_mw (e.g. [aragon, madrid] means dc_mw at each).
    # Aragon is the study default: the GW-scale new-build pipeline is there (AWS 33.7bn EUR
    # Zaragoza/Huesca/Teruel, Microsoft Villamayor de Gallego, QTS/Blackstone campus).
    sites: [aragon]
    # Study dc_mw levels: 500 / 1000 / 2000 / 4000 / 6000 MW. Context (cited in the decision
    # log): Red Eléctrica has granted data centers 6.33 GW of transmission access (34% of
    # demand access); MITECO counts >12 GW of access and connection rights since 2021;
    # SpainDC projects 2.6 GW installed by 2030. So 500 MW = near-term single-hub
    # build-out, 2000 MW ~ the 2030 national fleet, 6000 MW = all granted transmission
    # access materializes (stress case).
    nodes:
      andalusia: ES0 0AC
      catalonia: ES0 1AC
      basque_country: ES0 2AC
      castilla_leon: ES0 3AC
      valencia_murcia: ES0 4AC
      galicia: ES0 5AC
      madrid: ES0 6AC
      aragon: ES0 7AC
      balearics: ES1 0AC
    discount_rate: 0.07
  ppa:
    carriers: [onwind, solar, solar-hsat]
  solving:
    # LP solver for the study solves (open-source HiGHS by default); per-solver
    # options live in scripts/solve_network.py.
    solver: highs
  iteration:
    # Forward passes for the endogenous grid CFE factor (Riepin & Brown 2024:
    # plain replacement, no damping or stopping criterion). Toy networks settle
    # after the second pass; the convergence table reports the objective and
    # max |dCFE_t| per pass, flagging a scenario that needs more.
    n_iterations: 2
