# PyPSA-Eur v2026.09.0 overlay: 15-node ES/FR/PT electricity-only model for the
# Spain 80% hourly matching study. Scope: today's system (2025/26 fleet), no
# capacity-expansion year. Temporal resolution: 3-hourly averaged snapshots.

version: v2026.09.0
tutorial: false

run:
  name: wy2013
  scenarios:
    enable: true
    file: ../config/scenarios.yaml
  disable_progressbar: true
  shared_resources:
    policy: false

foresight: overnight

planning_horizons:
- 2025

countries:
- ES
- FR
- PT

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

enable:
  drop_leap_day: true

co2_budget:
  emissions_scope: CO2
  relative: false
  upper:
  lower:

electricity:
  base_network: osm
  transmission_limit: v1.0
  renewable_carriers:
  - solar
  - solar-hsat
  - onwind
  - offwind-ac
  - offwind-dc
  - offwind-float
  - hydro
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
  estimate_renewable_capacities:
    enable: true
    from_powerplantmatching: true
    from_irenastat: false
    year: 2024

atlite:
  default_cutout: europe-2013-sarah3-era5
  nprocesses: 4
  show_progress: false

renewable:
  # 5 CF classes per region for every PPA-candidate technology; existing plants are
  # spatially joined to their class, so fleet profiles reflect where plants actually
  # stand, and DC PPA candidates contract the best class with remaining potential.
  onwind:
    resource_classes: 5
  solar:
    resource_classes: 5
  solar-hsat:
    resource_classes: 5

clustering:
  mode: busmap
  cluster_network:
    n_clusters: 15
    algorithm: kmeans
  # ES receives the remainder (1 - 0.2667 - 0.1333 = 0.60 = 9/15 clusters) so that
  # distribute_n_clusters_to_countries preserves load-weighting between mainland (ES0: 8)
  # and Balearics (ES1: 1) instead of dividing ES weight equally across sub_networks.
  focus_weights:
    FR: 0.2667
    PT: 0.1333
  temporal:
    averaging: "3h"
    segmentation: false
    representative: false

sector:
  enabled: false

costs:
  year:

data:
  costs:
    source: archive
    version: v0.15.0
  cutout:
    source: archive
    version: v1.0

solving:
  options:
    load_shedding:
      enable: true
      default_cost: 10000
      all_carriers: true
  solver:
    name: highs
    options: highs-simplex

spain_cfe:
  # Scenario suites (cross products; make_summary collects the suite named by `suite`).
  # Policy set (agreed 2026-10-19): unmatched_dc = no-policy counterfactual;
  # annual_100_res = volumetric matching (voluntary industry practice);
  # hourly_80_ppa_only = 24/7 CFE score; strict_hourly_80_ppa_only = the decree's
  # Art. 9 (every hour); hourly_80_grid_credit = beyond-decree design alternative.
  # The _cfe (nuclear-as-clean) variants stay out of the matrix: the decree is
  # renewable-only. Target sweep (90/100) is pre-built via the policy names, as is
  # annual_80_res (Art. 8 alone; dropped 2026-10-20 for little added value).
  # A no_dc baseline row is added automatically for every run in the suite.
  # excess_cap: caps sigma on annual sales back to the grid,
  # sum_t ex_t <= sigma * sum_t d_t (Riepin & Brown 2023 convention), one scenario
  # per value. Study focus: 0.0 (no sales; surplus is stored or curtailed). Pre-built:
  # add 0.20 to a suite's list for the sales-allowed scenario (results under ex20).
  # Unlimited sales are deliberately not offered: the optimizer
  # would overbuild at the DC node to sell into a background system that is not in
  # equilibrium. The no_dc and unmatched_dc baselines have no surplus and are
  # solved once, under ex0.
  suite: core
  suites:
    # Working subset: the 2024 reference weather year, one DC size, all policies.
    core:
      runs: [wy2024]
      policies: [unmatched_dc, annual_100_res, hourly_80_ppa_only, strict_hourly_80_ppa_only, hourly_80_grid_credit]
      dc_mw: [500]
      siting: [spain_wide]
      excess_cap: [0.0]
    # Full matrix: all policies x all DC sizes x all weather years. The non-2024
    # weather years need their upstream builds first (study stage iv).
    full:
      runs: [wy2024, wy2010, wy2013, wy2020]
      policies: [unmatched_dc, annual_100_res, hourly_80_ppa_only, strict_hourly_80_ppa_only, hourly_80_grid_credit]
      dc_mw: [500, 1000, 2000, 4000, 6000]
      siting: [spain_wide]
      excess_cap: [0.0]
  # prepare_network.py patch engine: cited corrections, each individually switchable.
  patches:
    boundary_flows: true        # FR border closure from measured 2024 flows (model closure, always on)
    national_capacities: false  # fleet totals per carrier from published actuals (pro rata nodal)
    wind_correction: false      # ES/PT wind profiles scaled to cited actuals (residual ERA5 bias)
    phs_split: false            # pure-PHS energy/pumping/efficiency; mixed stays in reservoir hydro
    chp_profile: false          # cogeneration as fixed profile (Redeia monthly shape and output)
    csp: false                  # CSP capacity with solar-shaped profile scaled to Redeia output
    biomass_availability: false # cap biomass/waste at the realized capacity factor (fuel-limited)
    prices: false               # marginal costs from cited fuel + EU ETS prices (raw has no CO2 price)
    ntc_caps: false             # ES-FR / ES-PT / Balearic corridors capped to published NTC
    demand: false               # country loads scaled to cited annual busbar demand
    hydro_inflow: false         # wy2024 runs only: inflow to observed 2024 hydro energy
    fr_nuclear_profile: false   # FR nuclear seasonalized by the measured 2024 monthly output (calendar assumed to persist)
    ma_ad_exports: false        # fixed ES exports to Morocco and Andorra
  # named variants override the patch defaults; the {variant} wildcard picks one
  variants:
    raw: {}
    patched:
      national_capacities: true
      wind_correction: true
      phs_split: true
      chp_profile: true
      csp: true
      biomass_availability: true
      prices: true
      ntc_caps: true
      demand: true
      hydro_inflow: true
      fr_nuclear_profile: true
      ma_ad_exports: true
  dc:
    # Each listed site hosts the FULL dc_mw (e.g. [aragon, madrid] means dc_mw at each).
    # Aragon is the study default: the GW-scale new-build pipeline is there (AWS 33.7bn EUR
    # Zaragoza/Huesca/Teruel, Microsoft Villamayor de Gallego, QTS/Blackstone campus).
    sites: [aragon]
    # Study dc_mw levels: 500 / 1000 / 2000 / 4000 / 6000 MW. Context (news, Oct 2026):
    # Red Electrica has granted data centers ~6.3 GW of transmission access (~34% of all
    # demand access) with ~15.8 GW of requests pending; MITECO cites >12 GW of access and
    # connection rights granted since 2021; SpainDC expects 2-3 GW installed by 2030.
    # So 500 MW = near-term single-hub build-out, 2000 MW = realistic 2030 national fleet,
    # 6000 MW = all granted access materializes (stress case).
    nodes:
      andalusia: ES0 0AC
      catalonia: ES0 1AC
      basque_country: ES0 2AC
      castilla_leon: ES0 3AC
      valencia_murcia: ES0 4AC
      galicia: ES0 5AC
      madrid: ES0 6AC
      aragon: ES0 7AC
      balearics: ES1 0AC
    discount_rate: 0.07
  ppa:
    carriers: [onwind, solar, solar-hsat]
  solving:
    # LP solver for the study solves: highs (default; open-source, reproducible) or
    # gurobi (plain out-of-the-box defaults; ~5x faster, see README).
    solver: highs
  iteration:
    # Forward passes for the endogenous grid CFE factor (Riepin & Brown 2023:
    # plain replacement, no damping or stopping criterion; one forward pass
    # converges well). The convergence table reports objective and max |dCFE_t|
    # per pass as the signal that a scenario might need more passes.
    n_iterations: 2
