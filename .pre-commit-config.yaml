exclude: "^LICENSES"

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    # vendored primary sources and the two committed wy2024 networks are deliberately large
    exclude: ^(data/custom/sources/|resources/)

# Run ruff to lint and format
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.20
  hooks:
    # Run the linter.
  - id: ruff
    args: [--fix]
    # Run the formatter.
  - id: ruff-format

  # Find common spelling mistakes in comments and docstrings
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.2
  hooks:
  - id: codespell
    args: ['--ignore-regex="(\b[A-Z]+\b)"', '--ignore-words-list=fom,appartment,bage,ore,setis,tabacco,berfore,vor,pris,bund,ons,anual,idae'] # Ignore capital case words, e.g. country codes; anual/IDAE are Spanish source names
    types_or: [python, rst, markdown]
    files: ^(scripts|test|doc)/

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    exclude: (\.lock\.yaml)$
    args: [--autofix, --indent, "2", --preserve-quotes]

  # Format Snakemake rule / workflow files
- repo: https://github.com/snakemake/snakefmt
  rev: v2.0.3
  hooks:
  - id: snakefmt

  # Check for FSFE REUSE compliance (licensing)
- repo: https://github.com/fsfe/reuse-tool
  rev: v6.2.0
  hooks:
  - id: reuse-lint-file
